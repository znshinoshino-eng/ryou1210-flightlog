name: Update sitemap
on:
  push:
    branches: [main]
    paths: ["**.html"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/build_sitemap.py
      - name: Commit sitemap if changed
        run: |
          if ! git diff --quiet -- sitemap.xml || [ -n "$(git ls-files --others -- sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Update sitemap"
            git push
          fi
