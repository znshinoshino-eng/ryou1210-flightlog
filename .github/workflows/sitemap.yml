name: Update sitemap and search tags
on:
  push:
    branches: [main]
    paths: ["**.html"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/icons.py
      - run: python3 scripts/seo_tags.py
      - run: python3 scripts/hreflang.py
      - run: python3 scripts/card_dates.py
      - run: python3 scripts/build_sitemap.py
      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain -- '*.html' sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add -- '*.html' sitemap.xml
            git commit -m "Update sitemap and search tags"
            git push
          fi
